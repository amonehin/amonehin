name: Update README Activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch GitHub activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Live Work" > README.md
          echo "" >> README.md
          echo "### Recent Pull Requests" >> README.md
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=author:amonehin+is:pr&per_page=5" \
            | jq -r '.items[] | "- [#\(.number)](\(.html_url)) — \(.title)"' >> README.md

          echo "" >> README.md
          echo "### Recent Commits" >> README.md
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/amonehin/events/public" \
            | jq -r '.[] | select(.type=="PushEvent") | .payload.commits[]? | "- \(.sha[0:7]) — \(.message)"' | head -n 5 >> README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update live work section"
          git push
